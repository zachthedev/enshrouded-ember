# cargo-semver-checks, the one tool kept out of mise.toml. mise loads this file
# only where MISE_ENV=semver, which cd.yml's release-update job sets and no job
# holding a credential does.
#
# The file keeps cargo-semver-checks out of every configuration the release-pr
# job loads, because the check builds every dependency's build script and proc
# macro and that job holds the releaser token. No job puts mise's shims on
# PATH, and a shim installs a configured tool the first time a process looks
# for it, so this file is the second layer: outside every configuration that
# job loads, the check cannot run there at all.
#
# mise.semver.lock holds its checksums, written by `MISE_ENV=semver mise lock`.
# The platforms and the locked mode come from mise.toml, which mise loads beside
# this file: its [tool_config] lock refuses a version here that
# mise.semver.lock does not record.

[tools]
"github:obi1kenobi/cargo-semver-checks" = "0.50.0"
