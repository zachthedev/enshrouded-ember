# Every tool the gate and the release workflow run that rustup, cargo and bun
# do not provide, pinned. One version per tool, here and nowhere else: `cargo
# xtask check` resolves each binary through `mise which`, and the ci and cd
# workflows install from this file. cargo-semver-checks is the one exception,
# pinned in mise.semver.toml for the reason that file gives.
#
# A bare name comes from mise's registry, which routes it to a prebuilt release
# artifact. A `github:` coordinate names a tool the registry does not carry, and
# `version_prefix` builds the release tag where that tag is not the bare
# version. The cargo backend is deliberately unused: it runs `cargo install`,
# which builds from source, and `mise lock` records no checksum for a build.
#
# mise.lock holds a checksum per platform for every entry below, so a version
# appears here and a hash appears there. `mise lock` rewrites it after any edit
# to this file, for the platforms `lockfile_platforms` names. `cargo xtask pins`
# reads the pair, and the gate runs it before it runs any tool.
#
# The comment beside each entry names what its lockfile entry rests on:
# provenance, where the publisher attests the release and mise re-checks the
# attestation at install time; a checksum in a pinned tree, where the registry
# entry mise resolves through carries the digest; a checksum recorded at lock
# time, where mise hashes the release asset it downloaded; or a checksum
# recorded here, computed by hand at the bump because the publisher records
# none.
#
# Renovate's mise manager bumps a version here. `mise lock` then rewrites the
# lockfile, and a taplo bump takes its hash by hand, in the same change.

[tools]
# provenance
actionlint = "1.7.12"
# checksum in a pinned tree
cargo-deny = "0.20.2"
# checksum recorded at lock time
"github:bnjbvr/cargo-machete" = "0.9.2"
# provenance
"github:nextest-rs/nextest" = { version = "0.9.145", version_prefix = "cargo-nextest-" }
# checksum recorded at lock time
release-plz = "0.3.169"
# checksum in a pinned tree
shellcheck = "0.11.0"
# checksum recorded here
taplo = "0.10.0"
# provenance
zizmor = "1.30.1"

[tool_config]
# The locked mode no environment variable reaches. mise refuses to install a
# version mise.lock does not record, so an edit to [tools] with no relock is
# refused rather than fetched. It requires an entry rather than a checksum,
# which is why the gate reads the lockfile itself.
locked = true

[settings]
# The same refusal at the settings level, which is what `mise which` answers
# for: with this line gone, `mise which` resolves a tool this repository pins
# nowhere out of a developer's global configuration. `MISE_LOCKED=false` and a
# `locked_scopes` that drops `project` each turn this line off, and neither
# reaches the [tool_config] line above.
locked = true

# Write and read mise.lock, for exactly these platforms. A platform block for
# any other is a url and a checksum nothing installs, and the gate refuses it.
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64", "windows-x64"]

# Re-check an attested artifact against its attestation at install time. With
# this off, an install trusts the provenance mise.lock records and checks only
# that the matching setting is still on, so an entry claiming an attestation it
# does not have installs without one. A tool whose entry carries no provenance
# line installs on its checksum either way, so this needs no allow list: the
# per-tool provenance line in mise.lock is what makes the check required.
locked_verify_provenance = true

# An attestation lookup that fails is a refusal, not a pass. Without this, an
# API outage installs an attested tool as if it carried no attestation.
provenance_api_failures_fatal = true
