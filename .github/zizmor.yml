# The thresholds this repository sets. Every other audit runs at zizmor's
# defaults. The gate's zizmor row reads this file, and so does the reusable
# workflows job in continuous integration.
rules:
  # Every action is pinned to a commit. A tag can be retargeted by its owner
  # with no pull request and no cooldown; a commit cannot. zizmor's default
  # accepts a tag, so the policy names the hash.
  unpinned-uses:
    config:
      policies:
        '*': hash-pin
  # zizmor asks for seven days by default. The project standard is three, which
  # is the window that catches almost every package published and then pulled
  # while still letting a legitimate release land in the same week. A shorter
  # cooldown still fails. A cooldown block removed entirely passes this audit.
  dependabot-cooldown:
    config:
      days: 3
  # The build-watch jobs that commit check out with the ember-ci deploy key and
  # push over SSH, so the key stays in the checkout for the push. Each entry is
  # the file and line of one checkout step, so a step that moves loses its
  # waiver and the audit reports it again.
  artipacked:
    ignore:
      - build-watch.yml:144
      - build-watch.yml:467
      - client-build-watch.yml:63
  # An advisory published against an unchanged action pin turns every pull
  # request's workflows check red until the pin moves. A waiver is one GHSA id
  # per entry, with a comment beside it naming the advisory, what it blocks, why
  # shipping is safer and the condition that removes it. No advisory is waived.
  known-vulnerable-actions:
    config:
      allow: []
  # deps.yml's deps job hands its called workflow every secret. The called job
  # names the deps environment, and a caller that runs in no environment cannot
  # pass that environment's secret by name. The waiver takes the whole file,
  # because the shared workflows job holds the control: its secrets-inherit
  # step fails unless every job passing secrets: inherit calls a workflow under
  # zachthedev/.github/.github/workflows/. Until the next .github pin, the gate
  # holds the waiver beside that job: its zizmor row fails when a file this list
  # names holds no job passing secrets: inherit. cd.yml passes secrets: inherit
  # to nothing, since release-plz runs from its mise pin and not through the
  # shared release-pr workflow, so deps.yml is the one file.
  secrets-inherit:
    ignore:
      - deps.yml
