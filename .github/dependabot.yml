version: 2

# Stable cargo has no publish-age gate of its own, so the cooldown below is the
# only thing between this repository and a version published minutes ago.
#
# Patch and minor updates arrive grouped, one pull request per ecosystem per
# week, so the gate runs once per group. A major arrives on its own, because it
# is a decision rather than a bump.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # The crates that run inside a live dedicated server: they read the
      # process image, install inline detours, and load libraries into a
      # running game. A bump here can crash somebody's server, so it arrives
      # separately from the rest and is read on its own.
      runtime:
        patterns:
          - "minhook"
          - "pelite"
          - "goblin"
          - "windows-link"
        update-types: ["patch", "minor"]
      workspace:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    labels: ["dependencies", "cargo"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      bun:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    labels: ["dependencies", "bun"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
