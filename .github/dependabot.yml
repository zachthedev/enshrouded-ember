# Dependabot here opens one kind of pull request: a security fix for a crate that Cargo.toml does not
# name. Renovate opens every version bump and every security fix for a crate it does name. Those come
# from the kind preset this repository extends in .github/renovate.json.
#
# The repository setting "Dependabot security updates" turns the security half on.
# open-pull-requests-limit: 0 keeps the version half off. Security pull requests take no cooldown and
# no schedule, so the schedule key below is inert. The file format requires it.
#
# allow with dependency-type: indirect alone refuses every crate that has a manifest requirement. A
# direct advisory therefore records "all versions were ignored" on the alert, and Renovate's fix is the
# only pull request. A transitive crate has no manifest requirement, so it passes. Dependabot then runs
# cargo update -p <crate> --precise <fix> inside the parent's range.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    allow:
      - dependency-type: indirect
    labels:
      - dependencies
      - security
    commit-message:
      prefix: fix(deps)

  # Actions have no transitive dependencies, and Renovate fixes an action advisory. The wildcard
  # ignore is what silences security pull requests here. The limit alone leaves them on.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
