name: audit

# The whole-tree reports, each on its own clock. A red run is a report, never a
# check: it means work to pick up. Nothing merges, releases or deploys through
# this file, and no ruleset requires it.
#
# `cargo deny check advisories` reads every crate in Cargo.lock against the
# RustSec database and refuses a yanked crate. Dependabot alerts read the same
# lockfile against GitHub's database, which lacks part of RustSec, and
# cargo-audit refuses advisories GitHub has not rated; the two fail in opposite
# directions, so both run. The gate runs the other deny checks per push and
# never this one, because an advisory published overnight would turn a change
# red that touched nothing.
#
# The workflows job runs the shared actionlint and zizmor job, whose online
# audits read the pinned actions: a pinned commit outside its action's
# repository, a stale action ref, a known-vulnerable action. Those answers
# change with no pull request, so a schedule is what asks again.
on:
  schedule:
    # Weekly, Monday. The hour is clear of deps.yml's daily cron.
    - cron: '41 6 * * 1'
    # Weekly, Monday, an hour after the advisories run.
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  # The first weekly clock, and every dispatch. The schedule context carries
  # the cron that fired, so a cron edit changes its twin here.
  advisories:
    if: github.event_name != 'schedule' || github.event.schedule == '41 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # This job pushes nothing, so the job token does not stay in the checkout
      # for the steps that follow it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pin rules, ahead of the step that installs from them. This command
      # reads mise.toml and mise.lock and runs nothing, so it needs neither mise
      # nor any pinned tool.
      - run: cargo xtask pins
      # The action installs mise and nothing else: the install below runs
      # --locked and names one tool, so cargo-deny arrives at the release
      # mise.lock records and nothing else is fetched. The mise release is
      # exact, because an unpinned one resolves at run time and a resolved
      # release is under no cooldown.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
          install: false
      - run: mise install --locked cargo-deny
      # The binary mise resolved is the binary that runs, as in the gate.
      - run: '"$(mise which cargo-deny)" --locked check advisories'

  # The second weekly clock, and every dispatch. The calling job grants what
  # the called job declares.
  workflows:
    if: github.event_name != 'schedule' || github.event.schedule == '41 7 * * 1'
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/workflows.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
