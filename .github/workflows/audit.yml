name: audit

# The whole-tree reports, on one daily clock. A red run is a report, never a
# check: it means work to pick up. Nothing merges, releases or deploys through
# this file, and no ruleset requires it.
#
# `cargo deny check advisories` reads every crate in Cargo.lock against the
# RustSec database and refuses a yanked crate. Dependabot alerts read the same
# lockfile against GitHub's database, which lacks part of RustSec, so both run.
# The gate runs the other deny checks per push and never this one, because an
# advisory published overnight would turn a change red that touched nothing.
#
# `bun run audit` reads every package bun.lock resolves against npm's
# advisories. GitHub's dependency graph reads package.json's direct
# dependencies alone, so no Dependabot alert covers a package they pull in.
#
# The workflows job runs the shared actionlint and zizmor job, whose online
# audits read the pinned actions: a pinned commit outside its action's
# repository, a stale action ref, a known-vulnerable action. Those answers
# change with no pull request, so a schedule is what asks again.
on:
  schedule:
    # At least once a day. The hour is clear of deps.yml's cron. Every job runs
    # on this one clock, so none compares a cron string.
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions: {}

env:
  # mise fetches a lockfile entry's url_api when a HEAD on its url fails, and
  # that reference can name another release's asset. mise.toml sends every
  # such request nowhere, and a committed config file can lift a setting made
  # there, so every mise run here carries the same map, which no file overrides.
  MISE_URL_REPLACEMENTS: '{"regex:^https://api\\.github\\.com/repos/[^/]+/[^/]+/releases/assets/.*$":"https://url-api-refused.invalid/"}'
  # mise reads mise.toml alone in every job here: no .tool-versions, no
  # environment file and no per-platform file. A committed mise.local.toml,
  # mise.<env>.toml or .tool-versions then chooses nothing an install, a shim
  # or mise-action fetches or runs.
  MISE_OVERRIDE_CONFIG_FILENAMES: mise.toml
  MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
  MISE_ENV: ''
  MISE_AUTO_ENV: 'false'

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Ahead of the checkout, as in ci.yml, so the action reads no repository
      # file. It installs mise and nothing else: the install below runs
      # --locked and names one tool, so cargo-deny arrives at the release
      # mise.lock records and nothing else is fetched. cache: false, so
      # nothing is restored ahead of the pin rules. The mise release is
      # exact, because an unpinned one resolves at run time and a resolved
      # release is under no cooldown.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
          install: false
          # No mise environment, PATH entry or shim reaches a later step, so a
          # bare program name never resolves to a tool mise.toml pins. Every
          # tool runs through the path `mise which` prints.
          env: false
          export_path: false
          add_shims_to_path: false
          cache: false
          # An empty one keeps the action from exporting the job token to every
          # later step.
          github_token: ''
      # This job pushes nothing, so the job token does not stay in the checkout
      # for the steps that follow it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pin rules, ahead of the step that installs from them. This command
      # reads mise.toml and mise.lock and runs nothing, so it needs neither mise
      # nor any pinned tool.
      - run: cargo xtask pins
      - run: mise install --locked cargo-deny
      # The binary mise resolved is the binary that runs, as in the gate.
      - run: '"$(mise which cargo-deny)" --locked check advisories'

  # bun audit reads bun.lock alone, so nothing is installed and no package's
  # install script runs.
  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # This job pushes nothing, so the job token does not stay in the checkout
      # for the steps that follow it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # packageManager in package.json is the one Bun pin. The action verifies
      # no download, so that pin plus the cooldown is the control.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # A clean verdict names no endpoint, and bun audit takes no --registry
      # flag, so the step names the registry it asks.
      - run: bun run audit
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

  # The calling job grants what the called job declares.
  workflows:
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/workflows.yml@ec458567a7200c4ad96ed0c7556e06bc2b287738 # v0.3.0
