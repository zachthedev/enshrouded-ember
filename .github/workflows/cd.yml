name: cd

# Everything after a merge. A push to main keeps the release pull request
# current. The squash merge of that pull request makes the next run publish
# every crate it names to crates.io, tag each one and draft ember-loader's
# release, once the release environment's reviewer approves; the publish job
# then flips that draft public under a second approval. release-plz.toml says
# what releases and how it is versioned.
#
# The merge is a squash, so the tag release-plz creates names the commit this
# run is for, which the publish job requires. A merge commit would have
# release-plz tag the pull request's last commit instead.
#
# release-plz runs from the mise pin, not release-plz/action, which the
# handbook's Workflows row names: a deliberate deviation. The action runs the
# semver check and opens the pull request in one process under one token, and
# has no command that runs the check alone. mise.toml pins release-plz and
# mise.semver.toml pins cargo-semver-checks.
on:
  push:
    branches: [main]

permissions: {}

# Every action is pinned to a commit. A tag can be retargeted by its owner with
# no pull request and no cooldown; a commit cannot. Renovate bumps the hash and
# keeps the version comment current.
jobs:
  # Computes the next release: every crate's version, its changelog and the
  # lockfile, with release-plz's semver check deciding how far a library's
  # version moves. The check builds rustdoc for each changed library and its
  # published baseline, which runs every dependency's build script and proc
  # macro, so this job holds no credential: no environment, and a job token
  # that reads.
  release-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Loads mise.semver.toml beside mise.toml. The release-pr job never sets
    # it, so cargo-semver-checks is outside every mise configuration there and
    # no shim can install it.
    env:
      MISE_ENV: semver
    steps:
      # The whole history, because release-plz reads every commit since each
      # crate's last release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Installs mise and nothing else, as in ci.yml. The install below runs
      # --locked, so a tool the lockfiles do not record is refused. cache:
      # false, because a cache this job restored or saved would carry what its
      # build scripts wrote.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
          install: false
          cache: false
      - run: mise install --locked release-plz github:obi1kenobi/cargo-semver-checks
      - run: release-plz update
      # Every change release-plz made, a crate's first changelog included,
      # staged so the untracked files are in the diff.
      - run: |
          git add --all
          git diff --cached --output="$RUNNER_TEMP/release.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-update
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
          retention-days: 1

  # Opens or updates the release pull request under the releaser app, from the
  # change release-update computed. A pull request opened with the job token
  # starts no workflow run, so no check would reach it; the app is a distinct
  # actor, and its pull request runs CI.
  #
  # The environment's key reaches this runner when the job starts, so nothing
  # here builds or runs the workspace's dependencies. cargo-semver-checks is
  # never installed: with the handoff applied every released crate is already
  # at its next version, and with no check to run, a handoff that leaves one
  # out costs a smaller version bump, which the pull request shows.
  release-pr:
    needs: release-update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two pushes landing together would race to write the same pull request.
    # Queued, not canceled, so the later push still reaches the release notes.
    concurrency:
      group: release-pr
      cancel-in-progress: false
    # The checkout alone reads with the job token. Everything that writes goes
    # through the app's token.
    permissions:
      contents: read
    # Holds the releaser app's client id and key and admits main alone, through
    # a deployment branch policy. No reviewer: an approval would hold every
    # push. deployment: false, because this is a credential scope and not a
    # target.
    environment:
      name: release-pr
      deployment: false
    steps:
      # release-plz pushes through the API with the app's token, so none stays
      # in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
          install: false
          cache: false
      - run: mise install --locked release-plz
      # Outside the checkout, because release-plz commits every changed and
      # untracked file in the tree.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-update
          path: ${{ runner.temp }}/release-update
      # release-update ran the dependencies' code, so its patch is untrusted.
      # Only the manifests, the lockfile and the changelogs apply: a cargo
      # config, a toolchain file or a mise file in the patch is dropped, since
      # each can make a command here run a program. The include list filters
      # by path alone, and release-plz commits whatever the tree holds, so a
      # symlink at a manifest path would publish the file it points at. So
      # git's own summary of the kept hunks may show only a new changelog at
      # 100644, and no hunk may be binary. No symlink may remain in the tree
      # either, because this repository tracks none.
      - run: |
          patch="$RUNNER_TEMP/release-update/release.patch"
          include=(--include=Cargo.lock --include='*Cargo.toml' --include='*CHANGELOG.md')
          summary=$(git apply --allow-empty --summary "${include[@]}" "$patch")
          refused=$(grep -v -E -e '^ create mode 100644 ([^ ]+/)?CHANGELOG\.md$' -e '^$' <<< "$summary" || true)
          if [ -n "$refused" ]; then
            echo "::error::release-update's patch changes more than file contents:"
            printf '%s\n' "$refused"
            exit 1
          fi
          numstat=$(git apply --allow-empty --numstat "${include[@]}" "$patch")
          if grep -q -E '^-' <<< "$numstat"; then
            echo "::error::release-update's patch carries a binary change"
            exit 1
          fi
          git apply --allow-empty "${include[@]}" "$patch"
          links=$(find . -path ./.git -prune -o -type l -print)
          if [ -n "$links" ]; then
            echo "::error::the tree holds a symlink after the patch:"
            printf '%s\n' "$links"
            exit 1
          fi
      # Minted last, so no earlier step runs beside it. Narrowed with
      # permission-* inputs; without one the token carries the whole
      # installation grant.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          # The release branch and its commit.
          permission-contents: write
          # The pull request itself.
          permission-pull-requests: write
      # --allow-dirty takes the applied patch as the release. The token goes
      # through the environment, which release-plz reads as GIT_TOKEN, so it
      # is not on the command line.
      - run: release-plz release-pr --allow-dirty --forge github --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        env:
          GIT_TOKEN: ${{ steps.token.outputs.token }}

  # Publishes every crate the merged pull request names, tags each one and
  # drafts ember-loader's release, once the release environment's reviewer
  # approves. No concurrency group: a queued run canceled by a later push would
  # skip a release.
  release:
    # A job in a reviewer-gated environment queues an approval on every run, so
    # this runs only on the release merge, whose squash subject is the pr_name
    # release-plz.toml pins. A stray commit with that subject costs one
    # approval, and release-plz then does nothing.
    if: "startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # crates.io trusted publishing. release-plz exchanges the workflow's OIDC
      # token for a short-lived publish token, so no registry token is stored
      # anywhere. The crates.io configuration names this file and `release`.
      id-token: write
    # The publish approval, which also holds the releaser app's client id and
    # key, because this job creates the tags.
    environment: release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
          install: false
          cache: false
      - run: mise install --locked release-plz
      # The tags and the draft release are created under the app, the one actor
      # the tag ruleset lets create a tag.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          # The tags and the draft release.
          permission-contents: write
          # Finding the release pull request the pushed commit came from.
          permission-pull-requests: read
      # The publish job below flips ember-loader's draft, the one crate with a
      # GitHub release. A run that did not release it hands on nothing, and
      # `created` says whether the run released anything at all.
      - id: release
        run: |
          release-plz release --forge github --output json > "$RUNNER_TEMP/release.json"
          tag=$(jq --raw-output '.releases[]? | select(.package_name == "ember-loader") | .tag' "$RUNNER_TEMP/release.json")
          created=$(jq --raw-output '(.releases // []) | length > 0' "$RUNNER_TEMP/release.json")
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "created=${created}" >> "$GITHUB_OUTPUT"
        env:
          GIT_TOKEN: ${{ steps.token.outputs.token }}
      # release-plz labels the release pull request `autorelease: pending` and
      # has no key for the release that follows, so these move the merged pull
      # request to `autorelease: tagged` once a release exists. The label write
      # takes a token of its own, so release-plz never holds it, and a failure
      # here leaves the release, which has already happened, to go on.
      - id: label-token
        if: steps.release.outputs.created == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          permission-pull-requests: write
      - if: steps.label-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.label-token.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          fi

  # Flips ember-loader's draft public under the release environment's reviewer.
  # No artifact is attached until the loader ships a built library. The calling
  # job grants what the called job declares, the attestation scopes included,
  # because the declaration is static.
  publish:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: zachthedev/.github/.github/workflows/publish.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
    with:
      tag: ${{ needs.release.outputs.tag }}
      flip: true
