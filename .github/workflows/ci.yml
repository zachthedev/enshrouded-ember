name: ci

# Everything that judges a change: the gate on every platform, the commit
# messages, the workflow linters and the advisory check. The shared jobs call
# the reusable workflows in zachthedev/.github, pinned at a release
# commit, so a fix there lands here on the next bump.
on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. A stacked pull request is based on
  # the layer below it, and a base filter would leave a middle layer unchecked.
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # mise fetches a lockfile entry's url_api when a HEAD on its url fails, and
  # that reference can name another release's asset. mise.toml sends every
  # such request nowhere, and a committed config file can lift a setting made
  # there, so every mise run here carries the same map, which no file overrides.
  MISE_URL_REPLACEMENTS: '{"regex:^https://api\\.github\\.com/repos/[^/]+/[^/]+/releases/assets/.*$":"https://url-api-refused.invalid/"}'
  # mise reads mise.toml alone in every job here: no .tool-versions, no
  # environment file and no per-platform file. A committed mise.local.toml,
  # mise.<env>.toml or .tool-versions then chooses nothing an install, a shim
  # or mise-action fetches or runs.
  MISE_OVERRIDE_CONFIG_FILENAMES: mise.toml
  MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
  MISE_ENV: ''
  MISE_AUTO_ENV: 'false'

# Every action is pinned to a commit. A tag can be retargeted by its owner with
# no pull request and no cooldown; a commit cannot. Renovate bumps the hash and
# keeps the version comment current.
jobs:
  # The gate a contributor runs locally, called and never restated.
  # `cargo xtask check --rows` prints what it covers. The pre-push hook runs it
  # on whichever host a contributor uses, and code behind cfg(windows) or its
  # inverse builds on one host only, so every platform runs it.
  gate:
    strategy:
      # A failure on one host says nothing about the others, so every leg
      # finishes.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Ahead of the checkout, so the action's own `mise --version` and
      # `mise ls` run with no repository file to read, and no template in a
      # checked-out mise.toml runs before the pin rules can refuse it. The
      # action installs mise and nothing else: the install below runs
      # --locked, so a tool mise.lock does not record is refused rather than
      # fetched. cache: false, so nothing is restored ahead of the pin rules
      # either. The action verifies its own mise download against a
      # minisign-signed SHASUMS256.txt, and a sha256 input returns before that
      # check runs, so none is passed. The mise release is exact, because an
      # unpinned one resolves at run time and a resolved release is under no
      # cooldown.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
          install: false
          # No mise environment or PATH entry reaches a later step: every tool
          # runs through its shim or `mise which`.
          env: false
          export_path: false
          cache: false
          # An empty one keeps the action from exporting the job token to every
          # later step.
          github_token: ''
      # This job pushes nothing, so the job token does not stay in the checkout
      # for the steps that follow it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The one third-party action. actions/cache needs hand-written keys for
      # the registry, the git database and the target directory, and this one
      # derives them from the lockfile and the toolchain.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # packageManager in package.json is the one Bun pin. The action verifies
      # no download, so that pin plus the cooldown is the control.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The pin rules, ahead of the step that installs from them, so no rule
      # reports a finding about bytes already on disk. This command reads
      # mise.toml and mise.lock and runs nothing, so it needs neither mise nor
      # any pinned tool.
      - run: cargo xtask pins
        shell: bash
      # A tool outside mise's registry looks up its attestations through the
      # GitHub API, which allows 60 unauthenticated requests an hour per
      # runner address. Only this step is handed the job token. A step ahead
      # of it that runs checkout code, `cargo xtask pins` among them, can
      # still reach it, and it reads this public repository and nothing more.
      - run: mise install --locked
        shell: bash
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      # Both legs name a shell, because a bare `run:` is bash on ubuntu and
      # pwsh on windows, so one line would execute under two dialects while
      # actionlint reads it as one. Each line below is the same in either
      # shell, so bash is the one that leaves actionlint reading what runs.
      - run: bun install --frozen-lockfile
        shell: bash
      # zizmor runs offline here, since CI is set and the gate holds no token.
      # Its online audits run in the shared workflows job.
      - run: cargo xtask check
        shell: bash

  # Each calling job grants what its called job declares. A called job can only
  # lower what its caller passes, and a caller passing none is refused before
  # any step runs.
  commits:
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/commits.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0

  workflows:
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/workflows.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0

  dependency-review:
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/dependency-review.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
