name: ci

on:
  push:
    branches: [main]
  pull_request:

# The token can read the checkout and nothing else, so a compromised action on
# a runner cannot push, release or write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a commit. A tag can be retargeted by its owner with
# no pull request and no cooldown; a commit cannot. Dependabot bumps the hash
# and keeps the version comment current.
jobs:
  # The pre-push hook runs this gate on whichever host a contributor uses. Code
  # behind cfg(windows) or its inverse builds on one host only, so both run it.
  gate:
    strategy:
      # A failure on one host says nothing about the other, so both legs finish.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # This job pushes nothing, so the job token does not stay in the checkout
      # for the steps that follow it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # The pin rules, ahead of the step that installs from them. mise-action
      # runs `mise install`, which fetches and unpacks every artifact mise.lock
      # records, so a rule that ran after it would report a finding about bytes
      # already on disk. This command reads mise.toml, mise.lock and this file
      # and runs nothing, so it needs neither mise nor any pinned tool.
      - run: cargo xtask pins
        shell: bash
      # mise reads mise.toml for every tool the gate runs and mise.lock for the
      # checksum of each artifact, so no release is written here. The action
      # verifies its own mise download against a minisign-signed SHASUMS256.txt,
      # and a sha256 input returns before that check runs, so none is passed.
      # The mise release is exact, because an unpinned one resolves at run time
      # and a resolved release is under no cooldown.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
      # Both legs name a shell, because a bare `run:` is bash on ubuntu and
      # pwsh on windows, so one line would execute under two dialects while
      # actionlint reads it as one. Each line below is the same in either
      # shell, so bash is the one that leaves actionlint reading what runs.
      - run: bun install --frozen-lockfile
        shell: bash
      - run: cargo xtask check
        shell: bash

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx --no-install commitlint --from ${{
          github.event.pull_request.base.sha }} --to ${{
          github.event.pull_request.head.sha }}
