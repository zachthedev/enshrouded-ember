name: codeql

# Code scanning from a committed workflow, never default setup: default setup
# pins nothing and names checks the repository does not control. The reusable
# workflow runs one analysis per language below. In a caller each check run is
# named <caller job> / Analyze (<language>), so here `codeql / Analyze (rust)`,
# `codeql / Analyze (javascript-typescript)`, `codeql / Analyze (java-kotlin)`
# and `codeql / Analyze (actions)`, which are the names a branch ruleset
# requires.
#
# The languages are every one the repository holds, plus actions: Rust for the
# crates, TypeScript for tools/, and Java for the Ghidra scripts under
# xtask/ghidra. The actions analysis runs beside zizmor, and neither replaces
# the other. Each runs under build-mode none. codeql-action runs Rust and
# TypeScript as asked, and a server-side flag can move Java to autobuild,
# which the run's log records.
on:
  push:
    branches: [main]
  pull_request:
  # At least once a week, so a query published after the last change to this
  # repository still reports against this tree. Thursday, clear of deps.yml's
  # and audit.yml's daily crons.
  schedule:
    - cron: '37 9 * * 4'

permissions: {}

jobs:
  # The calling job grants what the called job declares. A called job can only
  # lower what its caller passes, and a caller passing less is refused before
  # any step runs.
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: zachthedev/.github/.github/workflows/codeql.yml@ec458567a7200c4ad96ed0c7556e06bc2b287738 # v0.3.0
    with:
      languages: '[{"language": "rust"}, {"language": "javascript-typescript"}, {"language": "java-kotlin"}, {"language": "actions"}]'
