name: build-watch

# Steam serves a depot manifest only while it is current, so a build that is
# not archived before its manifest rolls cannot be fetched again without a
# Steam credential. The schedule is set by that risk, not by how fast anyone
# needs to know.
#
# What the cron asks for and what GitHub delivers are different things. A
# scheduled workflow is a best-effort trigger with no guarantee about when it
# runs, and GitHub drops a tick under load. Measured over this workflow's life
# to 2026-09-21, the gap between consecutive runs reached 6 hours 1 minute, and
# no run started within 7 minutes of the minute it asks for. Minute 17 is
# already the documented mitigation, which is to sit away from the top of the
# hour. What the archive needs is a run at least once a day, and the worst gap
# measured clears that. A cycle re-reads what Steam advertises and appends only
# on a change, so a tick that never arrives costs nothing by itself.
#
# A manifest that does roll is recoverable. An anonymous session is refused a
# historical manifest and an authenticated one is granted it, which is how the
# older builds reached the archive. The worst case therefore costs a pull by
# hand, with DepotDownloader under a maintainer's own Steam login, rather than
# the build.
#
# One operational caveat no line in this file can fix. GitHub disables a
# schedule in a public repository after 60 days with no repository activity,
# and emails the admin as the only signal. A quiet stretch between Keen
# releases is that state, and is also when the next build lands. Any commit
# resets the timer and this workflow commits whenever Steam moves, so the
# exposure is a repository with no other work going on. A manual run from the
# Actions tab resets it too.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# No pull_request trigger, and no archive credential anywhere in ci.yml. GitHub
# passes no secrets to a workflow triggered from a fork, so an archive step on
# pull_request would have no credential at all.
permissions:
  contents: read

# Where each credential comes from, and what its environment buys.
#
# Every secret this file names comes from a deployment environment. Each of
# those environments names main as its only deployment branch, so a workflow on
# any other branch is refused the secret. A pull request cannot reach one even
# by landing a change to this file.
#
# digest-push holds EMBER_CI_SSH_KEY, the private half of the ember-ci deploy
# key. The ruleset on main carries a DeployKey bypass, so it is the only actor
# that can push there. The watch and commit-digest jobs draw it, and both run
# on a schedule with nobody watching. That environment carries no reviewer,
# because a required reviewer parks every run in `waiting`. A build not
# archived inside its manifest window needs a Steam credential to fetch again,
# so that wait would cost the thing the push protects.
#
# archive-read holds R2_ARCHIVE_READ_ACCESS_KEY_ID and
# R2_ARCHIVE_READ_SECRET_ACCESS_KEY, which read the archive bucket and write
# nothing. archive-status draws them and answers on every scheduled run, which
# a case asserts. That environment carries no reviewer either, so the answer
# does not land behind the approval the write token sits behind. The split
# between the two jobs exists to keep it that way.
#
# archive-write holds the write pair and requires a maintainer's approval. That
# credential can overwrite an archived binary, and R2 has no versioning to undo
# it with.
#
# A reviewer list is a GitHub setting rather than a line here, so nothing in
# this repository can read one.

# Concurrency is per job rather than per workflow. The archive job waits for a
# maintainer's approval, and a run holding a workflow-level group holds it for
# that whole wait, which stops the watcher from reading Steam at all. A build
# could then move while the approval pended, and the fetch after the approval
# would return the newer one, which the provenance check refuses. The build
# that was waiting is then past its manifest and gone.
#
# Each group below covers one race, and every one is keyed by ref so a
# workflow_dispatch on a branch cannot cancel a pending scheduled run.

env:
  APP_SERVER: '2278520'
  DEPOT_SERVER: '2278521'
  # SteamCMD updates itself from Valve on every run, so this digest pins the
  # wrapper rather than the client. No bot reads a `docker run` line, so it is
  # bumped by hand. Taken from the ubuntu-24 tag on 2026-09-18.
  #
  # The one tool that talks to Steam here, for reading app info and for
  # fetching a build. The watch job gives the container no environment, no
  # volume and no token, so its only channel out is the stdout redirect. The
  # archive job mounts one directory for the payload and gives it nothing else.
  STEAMCMD_IMAGE: steamcmd/steamcmd:ubuntu-24@sha256:bf25fdfcfd8245a7f7b3dccfa0fe42004621aa99eb80166fc26f9d75083e8356
  # Depot 2278521 declares oslist windows, and a Linux SteamCMD selects depots
  # by client platform. Without this the fetch dies with "Missing
  # configuration" and writes nothing, measured on ubuntu-latest.
  STEAMCMD_PLATFORM: windows
  # Narrows the download plan rather than the extraction, so the fetch costs
  # megabytes rather than the multi-gigabyte depot. The names have to agree with
  # ARCHIVE_FILES in tools/records.ts, which a case asserts.
  STEAMCMD_FILE_FILTER: 'enshrouded_server.exe;enshrouded_server.kfc'

jobs:
  # Reads what Steam advertises and records it. No archive credential reaches
  # this job: it writes a list of numbers to the repository and nothing else.
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: digest-push
      deployment: false
    # Shared with the client watcher, which appends to the same record.
    # Two jobs appending to the end of one file and pushing it is the race,
    # and the loser rebases into a content conflict rather than replaying,
    # so its step dies under `bash -e` before the push. A group name is
    # repository-scoped, so one name serializes jobs in different
    # workflows and a name per job serializes neither against the other.
    # The group is named for the file rather than for a workflow, because
    # what it protects is the file.
    #
    # This rests on GitHub's documented grouping rather than on a run
    # anybody watched. A third run arriving while one is pending cancels
    # the pending one, which an hourly cadence does not reach.
    concurrency:
      group: steam-builds-record-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    outputs:
      server_changed: ${{ steps.server.outputs.changed }}
      server_build_id: ${{ steps.server.outputs.build_id }}
      server_manifest_id: ${{ steps.server.outputs.manifest_id }}
    steps:
      # Checked out over SSH with the ember-ci deploy key, because main
      # requires a pull request and a deploy key is the only actor that
      # bypasses that rule. This job's own GITHUB_TOKEN has no bypass, so a
      # push over HTTPS is refused.
      #
      # The bypass cannot be narrowed to one key. GitHub discards the actor id
      # and stores null, so it covers every deploy key on the repository. There
      # is exactly one today, and a read-only key added later silently gains
      # the same bypass, which makes adding one a decision about main rather
      # than a decision about reading.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # This job pushes, so the key stays in the checkout for the push.
        with: # zizmor: ignore[artipacked]
          ssh-key: ${{ secrets.EMBER_CI_SSH_KEY }}

      # packageManager in package.json is the one Bun pin. The action verifies
      # no download, so that pin plus the cooldown is the control.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # --ignore-scripts because the root `prepare` installs lefthook, whose
      # pre-push runs the whole gate. The runner has no tool belt, so the gate
      # exits non-zero and every push this workflow makes is refused. It also keeps any dependency lifecycle script away from the
      # job that holds the write credential.
      - run: bun install --frozen-lockfile --ignore-scripts

      # app_info_update 1 forces a fresh fetch. Without it a cold SteamCMD
      # prints an empty block, which the watcher refuses rather than recording.
      # A container that never returns would otherwise take the job's whole
      # budget, and this is the read the archive window depends on.
      - name: Read what Steam advertises for the dedicated server
        timeout-minutes: 5
        run: |
          mkdir -p .watch
          docker run --rm "$STEAMCMD_IMAGE" \
            +login anonymous \
            +app_info_update 1 \
            +app_info_print "$APP_SERVER" \
            +quit > ".watch/appinfo-$APP_SERVER.txt"

      - id: server
        name: Record the dedicated server's build state
        run: |
          bun run tools/watch-builds.ts \
            "$APP_SERVER" ".watch/appinfo-$APP_SERVER.txt" --depot "$DEPOT_SERVER"

      - name: Commit the record
        if: steps.server.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/steam-builds.jsonl
          git diff --cached --quiet || git commit -m 'chore(ci): record what Steam advertises'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # Gated on the public branch alone. A beta branch moving is a real
      # event that names neither of these: build_id and manifest_id both
      # follow public, so an issue opened because some other branch moved
      # would name the build that did not.
      #
      # Every value the body carries arrives through the environment rather
      # than pasted into the script, and reaches printf as an argument rather
      # than as a format string.
      #
      # The headings are the field labels in
      # .github/ISSUE_TEMPLATE/new-keen-build.yml, and the two answers are
      # options those dropdowns offer, so a machine-opened issue and a
      # hand-filled one read as one document.
      - name: Open the build issue
        if: steps.server.outputs.public_moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ steps.server.outputs.build_id }}
          MANIFEST_ID: ${{ steps.server.outputs.manifest_id }}
          CHANGE_NUMBER: ${{ steps.server.outputs.change_number }}
        run: |
          # Every backtick below opens a markdown code span in the issue body,
          # so these formats are single quoted on purpose and no expansion is
          # wanted inside them. Each directive sits on the line it excuses,
          # which is the one placement that cannot widen to the whole script.
          {
            printf '### Steam build id\n\n%s\n\n' "$BUILD_ID"
            printf '### How this build turned up\n\n'
            printf 'Steam moved on the public branch, and the watcher opened this\n\n'
            printf '### Can a client on this build still join a server on the one before?\n\n'
            printf 'Not checked\n\n'
            printf '### build.json\n\n'
            printf 'Nothing has extracted this build yet.\n\n'
            printf '### Anything else\n\n'
            printf 'App %s moved on its public branch.\n\n' "$APP_SERVER"
            # shellcheck disable=SC2016
            printf -- '- depot %s manifest `%s`\n' "$DEPOT_SERVER" "$MANIFEST_ID"
            # shellcheck disable=SC2016
            printf -- '- change number `%s`\n\n' "$CHANGE_NUMBER"
            # shellcheck disable=SC2016
            printf 'The archive job stores the build under `build/%s/`.\n\n' "$MANIFEST_ID"
            printf '### Before a row ships\n\n'
            printf -- '- [ ] The build is archived, or its manifest already rolled\n'
            # shellcheck disable=SC2016
            printf -- '- [ ] `cargo xtask schema extract` ran against it\n'
            # shellcheck disable=SC2016
            printf -- '- [ ] `cargo xtask schema diff <old> <new>` is in a comment below\n'
            printf -- '- [ ] Every signature row resolves against the real binary\n'
            printf -- '- [ ] The support window moved, so its oldest build left it\n'
          } > issue-body.md
          gh issue create \
            --label build \
            --title "build: server buildid $BUILD_ID" \
            --body-file issue-body.md

  # Asks the bucket whether the build the public branch names is archived. It
  # holds the read token and nothing else: no deploy key and no write
  # credential. Its environment carries no reviewer, so it answers on every
  # scheduled run without waiting on the approval the write token sits behind.
  # The archive job asks for that approval only when there is work.
  #
  # The bucket is the only thing that knows what it holds. steam-builds.jsonl
  # says what Steam advertised and build-digests.jsonl pins what a build's
  # files hash to, and neither is a receipt for an upload. A build is archived
  # when it has a digest row and every file the row names is in the bucket at
  # the recorded size, so a failure anywhere in the archive path leaves this
  # answering true and the next run tries again.
  #
  # !cancelled() rather than the implicit success(), so a red watch job does
  # not stop the archive. A build detected and then lost to a failure later in
  # that job is a build the bucket never gets, and the archiving window closes
  # when Keen's next build rolls the manifest. The manifest id is the real
  # gate: it is written only after the server's block parses, so an empty one
  # means there is nothing to ask about.
  archive-status:
    needs: watch
    if: ${{ !cancelled() && needs.watch.outputs.server_manifest_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: archive-read
      deployment: false
    permissions:
      contents: read
    outputs:
      needs_archive: ${{ steps.status.outputs.needs_archive }}
    steps:
      # This job pushes nothing, so the job token is not left in the
      # checkout for the steps that follow it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts

      # A bucket it could not ask fails this step and hands on nothing, so the
      # archive job is skipped for this run rather than started on a guess.
      #
      # The step also sweeps every other recorded build and fails when one of
      # them has left the bucket. That happens after the answer is written, so
      # a build nobody can refetch never holds back the one that can be.
      - id: status
        name: Ask the archive whether the build is there
        env:
          MANIFEST_ID: ${{ needs.watch.outputs.server_manifest_id }}
          R2_ARCHIVE_READ_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READ_ACCESS_KEY_ID }}
          R2_ARCHIVE_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READ_SECRET_ACCESS_KEY }}
        run: bun run tools/archive.ts status --manifest "$MANIFEST_ID"

  # The only job that holds the write token. The environment restricts it to
  # main, so a pull request cannot reach the credential even by landing a
  # workflow change, and it requires a maintainer's approval. This job will sit
  # in `waiting` until somebody approves it, which is deliberate and is not a
  # hang: the credential it is about to use can overwrite a binary that
  # continuous integration and developers later run, and R2 has no versioning
  # to undo that with.
  #
  # Gated on what the bucket holds rather than on whether this run saw a
  # change, so a build that was seen and not archived is tried again on every
  # run until it is.
  archive:
    needs: [watch, archive-status]
    # The manifest id is restated rather than inherited from the job above.
    # It names the directory the fetch fills and the keys the upload writes, so
    # the job that uses it is the job that checks it.
    if: >-
      ${{ !cancelled() && needs.archive-status.outputs.needs_archive == 'true'
      && needs.watch.outputs.server_manifest_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: archive-write
    # One writer at a time. The refusal that stops an overwrite is a check
    # followed by a write, so two runs uploading the same key is the window it
    # cannot close.
    concurrency:
      group: build-watch-archive-${{ github.ref }}
      cancel-in-progress: false
    # Reads the checkout and nothing else. This job pushes nothing, so it needs
    # no write to the repository and carries no deploy key. What it does hold
    # is the credential that can overwrite an archived binary, and keeping
    # those two apart is the point of the split.
    permissions:
      contents: read
    outputs:
      row: ${{ steps.row.outputs.row }}
    steps:
      # This job pushes nothing, and it runs a container and third-party code
      # with the write credential in reach, so the job token does not stay in
      # the checkout beside them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # --ignore-scripts because the root `prepare` installs lefthook, whose
      # pre-push runs the whole gate. The runner has no tool belt, so the gate
      # exits non-zero and every push this workflow makes is refused. It also keeps any dependency lifecycle script away from the
      # job that holds the write credential.
      - run: bun install --frozen-lockfile --ignore-scripts

      # No Steam credential ever enters continuous integration. An anonymous
      # session gets the current manifest and is refused a historical one, so a
      # missed build is backfilled by an authenticated pull by hand, with
      # DepotDownloader, which is the only tool that can name a manifest.
      #
      # `app_update` takes no manifest parameter and always fetches the head of
      # the branch, so this can return a build other than the one the watch job
      # saw. The record step is what catches that: it reads the manifest gid
      # out of the appmanifest this fetch writes and refuses a row that would
      # key these bytes under a different gid.
      #
      # The container writes as root, at mode 0755, and the runner reads both
      # files without a chown and without --user. Measured on ubuntu-latest.
      - name: Fetch the build while its manifest is current
        env:
          MANIFEST_ID: ${{ needs.watch.outputs.server_manifest_id }}
        run: |
          out=".cache/archive/$MANIFEST_ID"
          mkdir -p "$out"
          docker run --rm -v "$PWD/$out:/out" "$STEAMCMD_IMAGE" \
            +@sSteamCmdForcePlatformType "$STEAMCMD_PLATFORM" \
            +force_install_dir /out \
            +login anonymous \
            +app_info_update 1 \
            +sDepotDownloadFileFilter "$STEAMCMD_FILE_FILTER" \
            +app_update "$APP_SERVER" \
            +quit

          # A file filter matching nothing exits 0 over an empty directory and
          # prints "fully installed", so the exit code proves nothing on its
          # own. Every name the filter carries has to have arrived.
          IFS=';' read -r -a names <<< "$STEAMCMD_FILE_FILTER"
          for name in "${names[@]}"; do
            if [ ! -s "$out/$name" ]; then
              echo "SteamCMD exited 0 without writing $name. A file filter that matches nothing does exactly this." >&2
              ls -lR "$out" >&2 || true
              exit 1
            fi
          done
          ls -l "$out"

      # Emitted rather than appended, because this job must not push and so
      # cannot commit it. Every field the row carries is committed to a public
      # repository moments later, so none of it is secret and a job output is
      # the right place for it: an app id, a depot id, a build id, a manifest
      # gid, a revision, a branch path, and each archived file's size and
      # SHA-256 digest.
      #
      # A build that already has a row gets that row back once the fetched
      # bytes match it, and a fetch that disagrees with its row stops the job
      # here, before anything reaches the bucket.
      - id: row
        name: Hash the files and build the digest row
        env:
          MANIFEST_ID: ${{ needs.watch.outputs.server_manifest_id }}
          BUILD_ID: ${{ needs.watch.outputs.server_build_id }}
        run: |
          bun run tools/archive.ts emit \
            --dir ".cache/archive/$MANIFEST_ID" \
            --manifest "$MANIFEST_ID" \
            --build "$BUILD_ID"

      # The upload comes before the row is committed, and the commit happens in
      # a job that holds no archive credential. push is idempotent: it skips an
      # object that already hashes to the row, so a run that uploaded and then
      # failed before the row landed converges on the next pass rather than
      # refusing or overwriting.
      - name: Upload to the archive
        env:
          MANIFEST_ID: ${{ needs.watch.outputs.server_manifest_id }}
          ROW: ${{ steps.row.outputs.row }}
          R2_ARCHIVE_WRITE_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_WRITE_ACCESS_KEY_ID }}
          R2_ARCHIVE_WRITE_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_WRITE_SECRET_ACCESS_KEY }}
        run: |
          # The committed record may not hold this row yet, so push is pointed
          # at the one this job handed on.
          printf '%s\n' "$ROW" > row.jsonl
          bun run tools/archive.ts push \
            --dir ".cache/archive/$MANIFEST_ID" \
            --manifest "$MANIFEST_ID" \
            --record row.jsonl

  # Commits the row the archive job built. It holds the deploy key and no
  # archive credential, and the archive job holds the archive credential and no
  # deploy key, so neither sits beside the other. A case asserts both halves.
  #
  # If this job fails, the objects are in the bucket and the row is not
  # committed. archive-status still answers true, because a build with no row
  # is not archived, so the next scheduled run fetches again, rebuilds the
  # row, finds every object already holding the recorded bytes and uploads
  # nothing, and retries this commit. The irreplaceable half is already safe
  # while that repeats.
  #
  # A build that already had a row appends nothing and commits nothing here,
  # which is green.
  commit-digest:
    needs: [watch, archive]
    if: ${{ !cancelled() && needs.archive.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: digest-push
      deployment: false
    # The other pusher. A rebase handles a race with the watcher, and this
    # keeps two of these from racing each other.
    concurrency:
      group: build-watch-commit-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # This job pushes, so the key stays in the checkout for the push.
        with: # zizmor: ignore[artipacked]
          ssh-key: ${{ secrets.EMBER_CI_SSH_KEY }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts

      # The row crossed a job boundary as a string, so it is validated against
      # the same shape a read enforces and checked for a duplicate again. The
      # record may have gained that manifest in between.
      - name: Append the digest row
        env:
          ROW: ${{ needs.archive.outputs.row }}
        run: bun run tools/archive.ts append --row "$ROW"

      - name: Commit the digest row
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/build-digests.jsonl
          git diff --cached --quiet || git commit -m 'chore(ci): record an archived build digest'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

  # Diffs the new build's reflection schema against the build it follows, and
  # posts the answer to the build issue with watchlist hits first. The point is
  # one hour rather than one afternoon: a Keen build that ships container
  # permissions natively changes what this project should build, and the
  # watchlist is where that shows up.
  #
  # Gated on the archive job rather than on the digest commit, because what it
  # needs is the row that job hands on and the objects it uploaded. The archive
  # job runs once per build, so this runs once per build. A failure here is not
  # retried on the next scheduled run: the build is archived by then, so rerun
  # this job from the Actions tab.
  #
  # It holds the read token and nothing else. It pushes nothing, commits
  # nothing, and its only write is a comment on the issue the watcher opened.
  schema-diff:
    needs: [watch, archive]
    if: >-
      ${{ !cancelled() && needs.archive.result == 'success'
      && needs.watch.outputs.server_manifest_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: archive-read
      deployment: false
    permissions:
      contents: read
      issues: write
    steps:
      # This job pushes nothing, so the job token does not stay in the
      # checkout for the steps that follow it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts

      # The row for this build is not committed yet: the job that commits it
      # runs beside this one. It is handed over as a string instead, and the
      # record supplies the candidates.
      - id: previous
        name: Name the build this one follows
        env:
          MANIFEST_ID: ${{ needs.watch.outputs.server_manifest_id }}
          ROW: ${{ needs.archive.outputs.row }}
        run: bun run tools/archive.ts previous --manifest "$MANIFEST_ID" --row "$ROW"

      # Both builds come out of the archive rather than from Steam. Steam
      # serves only the current manifest, so the older build cannot be fetched
      # at all, and the new one is already in the bucket by now.
      - name: Pull both builds out of the archive
        env:
          MANIFEST_ID: ${{ needs.watch.outputs.server_manifest_id }}
          PREVIOUS_ID: ${{ steps.previous.outputs.previous_manifest_id }}
          ROW: ${{ needs.archive.outputs.row }}
          R2_ARCHIVE_READ_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READ_ACCESS_KEY_ID }}
          R2_ARCHIVE_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READ_SECRET_ACCESS_KEY }}
        run: |
          printf '%s\n' "$ROW" > row.jsonl
          bun run tools/archive.ts pull --manifest "$PREVIOUS_ID" --out ".cache/archive/$PREVIOUS_ID"
          bun run tools/archive.ts pull --manifest "$MANIFEST_ID" --out ".cache/archive/$MANIFEST_ID" \
            --record row.jsonl

      # An archived build carries the executable and the container header and
      # nothing else, so a command needing the resource container refuses on
      # one. Schema recovery reads the executable, which is what is here.
      - name: Recover both schemas
        env:
          MANIFEST_ID: ${{ needs.watch.outputs.server_manifest_id }}
          PREVIOUS_ID: ${{ steps.previous.outputs.previous_manifest_id }}
        run: |
          for id in "$PREVIOUS_ID" "$MANIFEST_ID"; do
            cargo xtask schema extract --build "$id" --server ".cache/archive/$id/enshrouded_server.exe" --force
          done

      # Watchlist hits come first in this output, which is the whole reason it
      # is posted rather than filed.
      - name: Diff the two recoveries
        env:
          MANIFEST_ID: ${{ needs.watch.outputs.server_manifest_id }}
          PREVIOUS_ID: ${{ steps.previous.outputs.previous_manifest_id }}
        run: |
          # tee rather than a redirect, so the recovery's output is in the log
          # as well as in the file, and pipefail so its own exit code is what
          # decides the step.
          set -o pipefail
          cargo xtask schema diff "$PREVIOUS_ID" "$MANIFEST_ID" | tee diff.txt

      # A comment is capped at 65,536 characters, and a Keen build that rewrote
      # the schema would pass that. The body is cut to fit and says so, and the
      # run's own summary carries the same text.
      - name: Post the diff to the build issue
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ needs.watch.outputs.server_build_id }}
          MANIFEST_ID: ${{ needs.watch.outputs.server_manifest_id }}
          PREVIOUS_ID: ${{ steps.previous.outputs.previous_manifest_id }}
        run: |
          # Every backtick below opens a markdown code span in the comment, so
          # these formats are single quoted on purpose.
          # shellcheck disable=SC2016
          {
            printf '### `cargo xtask schema diff %s %s`\n\n' "$PREVIOUS_ID" "$MANIFEST_ID"
            printf 'Recovered from the archived builds. Watchlist hits come first.\n\n'
            printf '```text\n'
            head -c 50000 diff.txt
            printf '\n```\n'
            if [ "$(wc -c < diff.txt)" -gt 50000 ]; then
              printf '\nCut to fit a comment, from %s lines. The rest is in the run log.\n' \
                "$(wc -l < diff.txt)"
            fi
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

          number="$(gh issue list --label build --state open \
            --search "buildid $BUILD_ID in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "No open build issue names buildid $BUILD_ID, so the diff is in this run's summary only."
            exit 0
          fi
          gh issue comment "$number" --body-file comment.md
