name: New Keen build
description: A dedicated server build no signature row covers.
title: 'build: server buildid '
# `build` is a label this repository adds to the kickstart's set. The build
# watcher opens each new build's issue under it, and the schema-diff job finds
# that issue by it.
labels: ['build']
body:
  - type: markdown
    attributes:
      value: |
        The watcher opens an issue by itself for every build that moves on the
        public branch. Search the tracker before filing.

        This form is for a build the watcher did not catch: one on a beta
        branch, one that arrived while the schedule was disabled, or one Ember
        refused to run against.

        The commands below fill most of this form:

        ```sh
        cargo xtask server fetch
        cargo xtask schema extract
        ```
  - type: input
    id: build_id
    attributes:
      label: Steam build id
      description: >
        The `buildid` line in `steamapps/appmanifest_2278520.acf` beside your
        server. `cargo xtask server fetch` names its output directory the same
        thing.
      placeholder: '23178631'
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How this build turned up
      description: >
        This says whether somebody is blocked, and which gap in the watcher let
        the build through. The last option is the one the watcher fills in for
        itself.
      options:
        - Ember refused to run against it
        - It is on a beta branch, which the watcher does not report
        - The watcher opened no issue for it
        - I pulled it from an old manifest by hand
        - Steam moved on the public branch, and the watcher opened this
    validations:
      required: true
  - type: dropdown
    id: joinable
    attributes:
      label: Can a client on this build still join a server on the one before?
      description: >
        A no means every operator is forced onto this build today. Pick "Not
        checked" rather than guessing.
      options:
        - 'Yes'
        - 'No'
        - Not checked
    validations:
      required: true
  - type: textarea
    id: build_json
    attributes:
      label: build.json
      description: >
        The file `cargo xtask schema extract` writes to
        `.cache/schema/<buildid>/build.json`. It carries the revision, the
        branch path and the fingerprint, so none of those is transcribed by
        hand.
      render: json
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What broke, what still works, and what you have not checked.
  - type: checkboxes
    id: maintainer
    attributes:
      label: Before a row ships
      description: The maintainer's sequence. A reporter leaves these unticked.
      options:
        - label: The build is archived, or its manifest already rolled
        - label: '`cargo xtask schema extract` ran against it'
        - label: '`cargo xtask schema diff <old> <new>` is in a comment below'
        - label: Every signature row resolves against the real binary
        - label: The support window moved, so its oldest build left it
