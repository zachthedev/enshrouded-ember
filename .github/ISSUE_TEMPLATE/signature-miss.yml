name: Signature miss
description: A symbol Ember could not resolve on a build the release supports.
title: 'sigs: '
# `sigs` is a label this repository adds to the kickstart's set. It keeps a
# symbol Ember could not resolve apart from other bugs, because its fix lands in
# ember-sigs.
labels: ['sigs']
body:
  - type: markdown
    attributes:
      value: |
        Ember fails closed: a mod whose required symbols are missing is disabled
        and every missing symbol is named in the startup report. Paste that
        report below rather than describing it.
  - type: input
    id: symbol
    attributes:
      label: Symbol
      description: The `SymbolId` the report names, exactly as printed.
      placeholder: 'game.crafting.craft_once'
    validations:
      required: true
  - type: input
    id: ember_version
    attributes:
      label: Ember version
      description: >
        The release you installed, or the commit sha for a build from source. A
        miss is a function of the version and the build together, so one
        identifies nothing alone.
      placeholder: 'x.y.z, or 6f9be1d'
    validations:
      required: true
  - type: input
    id: build_id
    attributes:
      label: Steam build id
      description: The build id of the Windows depot for app 2278520.
      placeholder: '23178631'
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: >
        The number in the first 512 bytes of enshrouded_server.kfc, beside the
        branch path and the build date. The server prints it at startup as `Game
        Version (SVN)`.
      placeholder: '1024233'
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Fingerprint
      description: >
        The CodeView RSDS GUID and age the loader matched on, as the startup
        report names them. Leave it blank when the report names none.
      placeholder: 'ae33b44863803d4eb31f31d4d84ae242 age 293'
  - type: textarea
    id: resolver_report
    attributes:
      label: Resolver report
      description: >
        The startup report from `ember/logs`, covering every tier that ran for
        this symbol and what each one produced.
      render: text
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Which tier disagreed?
      options:
        - Cross-reference from a format string
        - Wildcard byte pattern
        - Recorded offset
        - Every tier failed
        - Not stated in the report
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mods loaded, in load order
      description: >
        One id and version per line, and mark the ones the report disabled. Each
        mod declares the symbols it needs, so the set decides what had to
        resolve. Write none when Ember loaded alone.
      placeholder: |
        private-chests x.y.z  disabled
        team x.y.z
      render: text
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Windows
        - Wine
        - Proton
    validations:
      required: true
