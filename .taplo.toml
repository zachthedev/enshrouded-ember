# Every TOML file in this repository, formatted by `taplo fmt`. The gate runs
# `taplo fmt --check --config .taplo.toml`, so no TAPLO_CONFIG in the
# environment can point it at another file.
#
# taplo walks every directory and reads no .gitignore, so each ignored
# directory that can hold a TOML file is excluded here by name.

include = ["**/*.toml"]

exclude = [
    ".cache/**",
    ".claude/worktrees/**",
    "node_modules/**",
    "target/**",
]

[formatting]
# A cargo-machete ignore list stays one name per line, which reads and edits
# more easily than a collapsed array. This does not make two edits to one list
# independent: two deletions are two adjacent lines, and a three-way merge reads
# adjacent deletions as one hunk. One owner prunes a whole phase's names in one
# commit, so only one edit ever reaches a list.
array_auto_collapse = false
# .editorconfig sets four spaces for Rust and TOML, and `cargo add` writes
# manifests the same way.
indent_string = "    "
