[alias]
# The one entry point for repository automation. CONTRIBUTING.md, the pre-push
# hook and continuous integration all call `cargo xtask check`, so none of them
# can drift from the others. --locked here is what makes the gate refuse a
# manifest edit with no relock: this run resolves the workspace before any row
# does, so a row's own --locked would otherwise see a lockfile this run just
# rewrote.
xtask = "run --locked --package xtask --quiet --"
