[workspace]
resolver = "3"
members = [
    "crates/ember-platform",
    "crates/ember-sigs",
    "crates/ember-holistic",
    "crates/ember-kfc",
    "crates/ember-enshrouded",
    "crates/ember-sdk",
    "crates/ember-loader",
    "crates/ember-testkit",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/zachthedev/enshrouded-ember"
authors = ["ZachTheDev <hey@zachthe.dev>"]

[workspace.dependencies]
ember-enshrouded = { version = "0.1.0", path = "crates/ember-enshrouded" }
ember-holistic = { version = "0.1.0", path = "crates/ember-holistic" }
ember-kfc = { version = "0.1.0", path = "crates/ember-kfc" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = { version = "8.0.0", default-features = false }
goblin = "0.10.7"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
# Rust's tokenizer outside a procedural macro. The gate reads every lint waiver
# in a tracked .rs file from its tokens, with line numbers from span-locations.
proc-macro2 = { version = "1.0.107", default-features = false, features = [
    "span-locations",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting"] }
toml = "1.1.6"
which = "8.0.6"
windows-link = "0.100.0"
# One Win32 call in xtask: the known folders a mise child is given in place of
# the inherited ones.
windows-sys = "0.61.2"
# Decoding only, so the dictionary builder, the legacy frame formats and the
# array helpers stay out of the C build.
zstd = { version = "0.14.0", default-features = false }

tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "warn"
# A module that needs unsafe code takes an expect with a reason on its `mod`
# line, so the list of modules that hold any is the list of those attributes.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A lint waiver is an expect that names the lint it waives and says why, so a
# waiver whose lint stops firing fails the build. The level is deny, since
# clap's derive generates an allow of clippy::restriction, which rustc refuses
# under a forbid. `cargo xtask pins` refuses any attribute naming either lint,
# so no crate-level allow can turn them off.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
# A panic crossing a hook boundary into the engine's C++ frames is undefined
# behavior on Windows and under Wine alike, so the shipped library aborts rather
# than unwinding. Cargo ignores this setting for the test and bench profiles.
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
