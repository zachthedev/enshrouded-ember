[workspace]
resolver = "3"
members = [
    "crates/ember-platform",
    "crates/ember-sigs",
    "crates/ember-holistic",
    "crates/ember-kfc",
    "crates/ember-enshrouded",
    "crates/ember-sdk",
    "crates/ember-loader",
    "crates/ember-testkit",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/zachthedev/enshrouded-ember"
authors = ["Zach <me@zachthe.dev>"]

[workspace.dependencies]
ember-enshrouded = { version = "0.0.0", path = "crates/ember-enshrouded" }
ember-holistic = { version = "0.0.0", path = "crates/ember-holistic" }
ember-kfc = { version = "0.0.0", path = "crates/ember-kfc" }
ember-platform = { version = "0.0.0", path = "crates/ember-platform" }
ember-sdk = { version = "0.0.0", path = "crates/ember-sdk" }
ember-sigs = { version = "0.0.0", path = "crates/ember-sigs" }

# Versions resolved against crates.io on 2026-09-17.
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = { version = "8.0.0", default-features = false }
getrandom = "0.4.3"
goblin = "0.10.7"
minhook = "0.9.0"
owo-colors = "4.4.0"
pelite = "0.10.0"
# CommonMark and tables, for the tests that read the documentation. The HTML
# renderer and its command-line front end stay out.
pulldown-cmark = { version = "0.13.4", default-features = false }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"
windows-link = "0.100.0"
# Decoding only, so the dictionary builder, the legacy frame formats and the
# array helpers stay out of the C build.
zstd = { version = "0.14.0", default-features = false }

tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
# A panic crossing a hook boundary into the engine's C++ frames is undefined
# behavior on Windows and under Wine alike, so the shipped library aborts rather
# than unwinding. Cargo ignores this setting for the test and bench profiles.
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
