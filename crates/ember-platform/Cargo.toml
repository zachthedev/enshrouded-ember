[package]
name = "ember-platform"
description = "Operating system seam for Ember: executable image access, inline hooks, and library loading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.cargo-machete]
# Dependencies this crate declares and no module references yet. Listing them
# keeps `cargo machete` quiet without dropping the declaration, and a name
# leaves the list when code starts using it.
ignored = ["thiserror"]

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
minhook.workspace = true
pelite.workspace = true
windows-link.workspace = true

[lints]
workspace = true
