[package]
name = "ember-loader"
description = "The library the server loads: resolves the build, discovers mods, and starts them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.cargo-machete]
# Dependencies this crate declares and no module references yet. Listing them
# keeps `cargo machete` quiet without dropping the declaration, and a name
# leaves the list when code starts using it.
ignored = ["ember-enshrouded", "ember-holistic", "ember-platform", "ember-sdk", "ember-sigs",
    "serde", "serde_json", "thiserror", "tracing", "tracing-subscriber"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ember-enshrouded.workspace = true
ember-holistic.workspace = true
ember-platform.workspace = true
ember-sdk.workspace = true
ember-sigs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
