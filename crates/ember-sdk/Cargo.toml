[package]
name = "ember-sdk"
description = "The surface a mod author writes against: the Mod trait, hooks, config, and logging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.cargo-machete]
# Dependencies this crate declares and no module references yet. Listing them
# keeps `cargo machete` quiet without dropping the declaration, and a name
# leaves the list when code starts using it.
ignored = [
    "ember-platform",
    "ember-sigs",
    "semver",
    "serde",
    "serde_json",
    "thiserror",
    "tracing",
]

[dependencies]
ember-enshrouded.workspace = true
ember-holistic.workspace = true
ember-platform.workspace = true
ember-sigs.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true
